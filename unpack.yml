name: Unpack project

on:
  push:
    paths: [ "dedtime_project.zip" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace project files
        run: |
          mv dedtime_project.zip /tmp/p.zip
          unzip -q /tmp/p.zip -d /tmp/p
          git rm -r -q --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude .github /tmp/p/dedtime/ ./
          git add -A
          git reset -q -- .github
          git checkout -- .github
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Дедтайм MVP: замена проекта"
          git push
